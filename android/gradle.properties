org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Kotlin's incremental compiler is hitting a Windows-specific bug here
# ("Could not close incremental caches ... already registered") on every
# plugin subproject, reproducing even from a stone-cold clean build with
# no daemons alive — a known flake with memory-mapped incremental cache
# files on Windows (antivirus/real-time-protection file locking races
# with the Kotlin daemon). Disabling incremental compilation trades some
# build speed for a build that actually completes.
kotlin.incremental=false
