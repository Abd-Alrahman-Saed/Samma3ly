name: quran_mobile
description: نظام إدارة وتحفيظ القرآن الكريم - Flutter Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Database
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^2.4.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Code generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  fl_chart: ^0.68.0
  flutter_staggered_animations: ^1.1.0
  shimmer: ^3.0.0

  # Utilities
  uuid: ^4.4.0
  collection: ^1.18.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  drift_dev: ^2.19.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  riverpod_lint: ^2.3.12

flutter:
  uses-material-design: true

dependency_overrides:
  analyzer_plugin: ^0.13.0
