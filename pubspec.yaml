name: quran_mobile
description: نظام إدارة وتحفيظ القرآن الكريم - Flutter Mobile
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Database
  drift: ^2.19.0
  sqlite3_flutter_libs: ^0.5.0
  sqlite3: ^2.4.0
  path_provider: ^2.1.3
  path: ^1.9.0

  # Code generation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  flutter_staggered_animations: ^1.1.0
  shimmer: ^3.0.0

  # Utilities
  uuid: ^4.4.0
  collection: ^1.18.0
  crypto: ^3.0.3
  cryptography: ^2.7.0
  url_launcher: ^6.3.2
  share_plus: ^13.2.1
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  shared_preferences: ^2.5.5
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.9
  drift_dev: ^2.19.0
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_lint: ^2.3.12

flutter:
  uses-material-design: true

  # Sprint 1, item 1.5: this file is a variable font (its own `wght` axis
  # covers 400–700). Registering it four times under different `weight:`
  # values — the previous state here — tricks Flutter into treating it as
  # four distinct STATIC faces that all happen to load the same (default,
  # ~400) instance; anything requesting 500/600/700 then got synthetic
  # ("faux") bold instead of the font's real bold glyphs. A single
  # registration lets Skia interpolate the variable axis correctly for
  # whatever FontWeight is requested — no separate static files needed.
  #
  # QuranHafs (for displaying actual ayah text) is intentionally not
  # registered yet: no screen renders Quran verse text today, and it needs
  # a real licensed asset (e.g. KFGQPC Uthmanic Hafs) — not something to
  # fabricate here. Add it when a screen actually needs it.
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont_wght.ttf
    # Display font for headers/titles — per the adopted design
    # (docs/DESIGN_SPEC.md). OFL-licensed, same terms as Cairo.
    - family: Reem Kufi
      fonts:
        - asset: assets/fonts/ReemKufi-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReemKufi-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReemKufi-Bold.ttf
          weight: 700
